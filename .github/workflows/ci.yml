name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        run: python -m pip install -e "./apps/api[dev]"
      - name: Lint API
        run: python -m ruff check apps/api evals
      - name: Test API
        run: python -m pytest apps/api/tests -q
      - name: Validate workflow evaluation dataset
        run: python -m evals.validation
      - name: Run offline workflow acceptance gate
        run: >-
          python -m evals.run_workflow
          --dataset evals/datasets/workflow_smoke_v1.jsonl
          --concurrency 4
          --fail-on-gate

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint web
        run: pnpm lint
      - name: Test web
        run: pnpm test
      - name: Build web
        run: pnpm build
