[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-api"
version = "0.1.0"
description = "AI image platform API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.53.0,<1.0.0",
    "boto3>=1.43.99,<2.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "openai>=3.17.0,<4.0.0",
    "python-multipart>=0.0.32,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9,<10",
    "ruff>=0.14,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]