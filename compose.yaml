services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_image
      POSTGRES_USER: ai_image
      POSTGRES_PASSWORD: ai_image_local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_image -d ai_image"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ai_image:ai_image_local@database:5432/ai_image
      FRONTEND_ORIGIN: http://localhost:5173
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/database')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  load-api:
    profiles:
      - evaluation
    build:
      context: .
      dockerfile: evals/Dockerfile.load
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: load-test-disabled
      AWS_SECRET_ACCESS_KEY: load-test-disabled
      S3_BUCKET: load-test-disabled
      OPENAI_API_KEY: load-test-disabled
      MODEL_NAME: load-test-disabled
      IMAGE_GENERATION_MODEL: load-test-disabled
      DATABASE_URL: postgresql+psycopg://ai_image:ai_image_local@database:5432/ai_image
      FRONTEND_ORIGIN: http://localhost:5173
      LANGFUSE_TRACING_ENABLED: "false"
      LOAD_STUB_STORAGE_DELAY_MS: "0"
      LOAD_STUB_VISION_DELAY_MS: "50"
      LOAD_STUB_IMAGE_DELAY_MS: "250"
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/load-test/status')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  capacity-api:
    profiles:
      - capacity
    build:
      context: .
      dockerfile: evals/Dockerfile.load
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn evals.capacity_app:app --host 0.0.0.0 --port 8002 --workers 1",
      ]
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: capacity-test-disabled
      AWS_SECRET_ACCESS_KEY: capacity-test-disabled
      S3_BUCKET: capacity-test-disabled
      OPENAI_API_KEY: capacity-test-disabled
      MODEL_NAME: capacity-test-disabled
      IMAGE_GENERATION_MODEL: capacity-test-disabled
      DATABASE_URL: "postgresql+psycopg://ai_image:ai_image_local@database:5432/ai_image?application_name=capacity-api"
      FRONTEND_ORIGIN: http://localhost:5173
      LANGFUSE_TRACING_ENABLED: "false"
      CAPACITY_STUB_STORAGE_DELAY_MS: "0"
      CAPACITY_STUB_VISION_DELAY_MS: "50"
      CAPACITY_STUB_IMAGE_DELAY_MS: "250"
      LOG_LEVEL: INFO
    ports:
      - "8002:8002"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/capacity-test/status')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
